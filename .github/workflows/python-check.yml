name: Python checks

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall app tests
      - name: Run tests
        # A suíte herdada do Church Cap assume palestras em inglês; os testes do
        # fork (tests/test_source_language.py) fixam a língua por conta própria.
        env:
          CAPTION_SOURCE_LANGUAGE: en
        run: python -m unittest discover -s tests
